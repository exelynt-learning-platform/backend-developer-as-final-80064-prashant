server:
  port: ${PORT:8080}

spring:
  application:
    name: resource-booking-system
  profiles:
    default: dev

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:bookingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  seed:
    enabled: ${APP_SEED_ENABLED:true}
    admin-username: ${SEED_ADMIN_USER:admin}
    admin-password: ${SEED_ADMIN_PASS:admin123}
    admin-email: ${SEED_ADMIN_EMAIL:admin@exelynt.com}
    user-username: ${SEED_USER_NAME:user}
    user-password: ${SEED_USER_PASS:user123}
    user-email: ${SEED_USER_EMAIL:user@exelynt.com}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
